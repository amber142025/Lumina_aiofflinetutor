services:
  - type: web
    name: lumina-api
    runtime: docker
    rootDir: Backend
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "20"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini

databases:
  - name: lumina-db
    plan: basic-256mb
    region: singapore
    databaseName: lumina
    user: lumina_app
